#
# DO NOT EDIT THIS FILE USE KlipperScreen.conf
#

[menu __calibrate zoffset]
name: {{ gettext('Z Offset Calibration') }}
icon: z-farther
panel: zcalibrate

[menu __calibrate nozzle_offset]
name: {{ gettext('Nozzle Offset') }}
icon: nozzle_offset
panel: nozzle_offset
enable: {{ printer.extruders.count > 1 and 'ktamv' not in printer.config_sections }}

[menu __calibrate offset_manage]
name: {{ gettext('Nozzle Offset Calibration') }}
icon: camera-offset
panel: offset_manage
enable: {{ 'ktamv' in printer.config_sections }}

[menu __calibrate dual_zcalibrate]
name: {{ gettext('Dual Z Calibrate') }}
icon: camera-offset
panel: dual_zcalibrate
enable: {{ 'ktamv' not in printer.config_sections and 'dual_zcalibrate' in printer.config_sections}}

[menu __calibrate input_shaper]
name: {{ gettext('Input Shaper') }}
icon: move
panel: input_shaper
enable: {{ 'input_shaper' in printer.config_sections }}